<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>報告の確認 | More Better Gakujo</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/js/dashboard.js"></script>
</head>
<body><main>
  <p class="eyebrow">More Better Gakujo / 開発者用</p>
  <h1>報告の確認</h1>
  <p>件名と公開欄にも個人情報が含まれていないか確認し、GitHub の画面で編集してから投稿してください。</p>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="list-view" aria-label="報告の一覧">
    <label for="filter">状態</label>
    <select id="filter"><option value="new">未確認</option><option value="issued">Issue にした</option><option value="dismissed">対応しない</option></select>
    <ul id="reports" class="report-list"></ul>
    <div class="actions"><button id="previous" type="button">前のページ</button><span id="page"></span><button id="next" type="button">次のページ</button></div>
  </section>
  <section id="detail-view" hidden aria-label="報告の内容">
    <button id="back" type="button" class="secondary">一覧に戻る</button>
    <h2 id="report-title" tabindex="-1"></h2>
    <p id="report-meta"></p>
    <div id="public-fields"></div>
    <div class="private"><h3>診断情報 — 非公開</h3><p>この欄は Issue のリンクやコピーに含まれません。</p><pre id="diagnostic"></pre></div>
    <div class="actions"><a id="issue-link" class="button" target="_blank" rel="noopener noreferrer">GitHub で Issue を作る（新しいタブで開きます）</a><button id="copy" type="button" class="secondary">Issue の形でコピー</button></div>
    <p class="hint">リンク先を開くだけでは投稿されません。作成後に Issue 番号を登録してください。</p>
    <div class="actions"><button id="issued" type="button">Issue にした</button><button id="dismissed" type="button" class="secondary">対応しない</button><button id="new" type="button" class="secondary">未確認に戻す</button><button id="delete" type="button" class="secondary">削除</button></div>
  </section>
</main></body>
</html>
