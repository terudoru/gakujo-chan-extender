name: Release macOS Windows Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.68.0"
        required: true
        type: string
      release_scope:
        description: "Publish macOS, Windows and Android together, or add iOS later"
        required: true
        type: choice
        default: all
        options:
          - all
          - ios
      platform_commit:
        description: "For a later iOS build: full, validated commit SHA already on main"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: MoreBetterGakujo
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
  RELEASE_NOTES: "iOS/iPadOS self-signed build. See the GitHub release notes for details."

jobs:
  verify_release:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      platform_commit: ${{ steps.verify.outputs.platform_commit }}
    steps:
      - name: Checkout main and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag is part of main
        id: verify
        shell: bash
        env:
          RELEASE_SCOPE: ${{ inputs.release_scope || 'all' }}
          PLATFORM_COMMIT: ${{ inputs.platform_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Invalid release tag.'
            exit 1
          fi
          commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main
          tag_version="${RELEASE_TAG#v}"
          tag_version="${tag_version%%-*}"
          release_version="$(git show "${commit}:pubspec.yaml" | awk '/^version:/ { print $2; exit }')"
          release_version="${release_version%%+*}"
          if [[ "$release_version" != "$tag_version" ]]; then
            echo '::error::The release tag does not match the app version.'
            exit 1
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_SCOPE" == ios ]]; then
            if [[ ! "$PLATFORM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::Later iOS releases require a full validated commit SHA.'
              exit 1
            fi
            platform_commit="$(git rev-parse --verify "${PLATFORM_COMMIT}^{commit}")"
            git merge-base --is-ancestor "$platform_commit" origin/main
            git merge-base --is-ancestor "$commit" "$platform_commit"
            version="$(git show "${platform_commit}:pubspec.yaml" | awk '/^version:/ { print $2; exit }')"
            version="${version%%+*}"
            if [[ "$version" != "$tag_version" ]]; then
              echo '::error::The platform commit version does not match the release tag.'
              exit 1
            fi
            printf 'platform_commit=%s\n' "$platform_commit" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: [verify_release]
    if: ${{ github.event_name == 'push' || inputs.release_scope == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify_release.outputs.commit }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: false

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install PDF viewer dependencies for analysis
        working-directory: tools/pdf_preview
        run: flutter pub get

      - name: Analyze and test Windows and Android boundaries
        run: |
          flutter analyze --no-pub
          flutter test --no-pub \
            test/allowed_web_origins_test.dart \
            test/android_upload_files_test.dart \
            test/windows_web_message_bridge_test.dart \
            test/windows_webview_authenticated_download_test.dart \
            test/windows_webview_download_file_test.dart \
            test/gakujo_pdf_preview_server_test.dart \
            test/gakujo_remote_file_preview_test.dart \
            test/gakujo_upload_preview_lifecycle_test.dart \
            test/pdf_preview_outline_limits_test.dart \
            test/pdf_preview_worker_cleanup_test.dart \
            test/gakujo_qpdf_worker_test.dart
          python3 -m unittest discover -s test -p staged_release_test.py -v

      - name: Prepare Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing_secrets=()
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || missing_secrets+=(ANDROID_KEYSTORE_BASE64)
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] || missing_secrets+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || missing_secrets+=(ANDROID_KEY_ALIAS)
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] || missing_secrets+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing_secrets[@]} > 0 )); then
            echo "::error::Android release signing secrets are missing: ${missing_secrets[*]}"
            echo "::error::Configure all four repository secrets before running the release workflow."
            exit 1
          fi

          umask 077
          keystore_path="${GITHUB_WORKSPACE}/android/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [ ! -s "$keystore_path" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty keystore."
            exit 1
          fi
          printf '%s\n' \
            "storeFile=$keystore_path" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > "${GITHUB_WORKSPACE}/android/key.properties"

      - name: Build Android APK
        run: flutter build apk --release

      - name: Verify Android signing identity and upgrade version
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          signature="$("$build_tools/apksigner" verify --print-certs "$apk")"
          count="$(printf '%s\n' "$signature" | grep -c '^Signer #[0-9][0-9]* certificate SHA-256 digest:' || true)"
          actual="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [[ "$count" != 1 || "$actual" != dda68ac39ed55cfc079eaaae33e37eb0a39eeea6a9652071a338cc87b4407e5b ]]; then
            echo '::error::Android APK signing identity differs from the existing v0.70.0 and v0.70.1-beta.1 releases.'
            exit 1
          fi
          package_info="$("$build_tools/aapt" dump badging "$apk" | sed -n '1p')"
          if [[ "$package_info" != "package: name='net.yoshida.morebettergakujo' versionCode='"* ]]; then
            echo '::error::Android package identity is unexpected.'
            exit 1
          fi
          code="$(printf '%s\n' "$package_info" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")"
          if [[ -z "$code" || "$code" -le 71 ]]; then
            echo '::error::Android versionCode must exceed the existing beta version 71.'
            exit 1
          fi

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/${APP_NAME}-${RELEASE_TAG}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    needs: [verify_release]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_scope == 'ios' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify_release.outputs.platform_commit }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Package unsigned iOS IPA
        env:
          OUTPUT_PATH: dist/${{ env.APP_NAME }}-${{ inputs.tag_name || github.ref_name }}.ipa
        run: ./scripts/package_ios_ipa.sh

      - name: Upload iOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  macos:
    needs: [verify_release]
    if: ${{ github.event_name == 'push' || inputs.release_scope == 'all' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify_release.outputs.commit }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Test macOS security and Flutter behavior
        run: |
          bash scripts/test_darwin_secure_storage.sh
          flutter test --no-pub

      - name: Build macOS app
        run: flutter build macos --release

      - name: Verify macOS app bundle and launch
        timeout-minutes: 2
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          bash scripts/verify_macos_release.sh "$app_path"

      - name: Package macOS DMG
        run: |
          set -euo pipefail
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$app_path" ]; then
            echo "macOS .app bundle not found" >&2
            exit 1
          fi
          mkdir -p dist dmg_staging
          cp -R "$app_path" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "dist/${APP_NAME}-${RELEASE_TAG}.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: [verify_release]
    if: ${{ github.event_name == 'push' || inputs.release_scope == 'all' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify_release.outputs.commit }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: false

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Test Windows installer upgrades
        shell: pwsh
        run: |
          $env:INNO_ISCC_PATH = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $env:INNO_ISCC_PATH)) { throw 'Inno Setup compiler was not found.' }
          python -m unittest discover -s test -p windows_installer_upgrade_test.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer upgrade test failed.' }

      - name: Package Windows installer and portable zip
        shell: pwsh
        run: |
          $tagName = "${env:RELEASE_TAG}"
          $safeTagName = $tagName -replace '[^A-Za-z0-9._-]', '-'
          $appVersion = $safeTagName -replace '^[vV]', ''
          $versionNumbers = @([regex]::Matches($appVersion, '\d+') | ForEach-Object { $_.Value })
          if ($versionNumbers.Count -eq 0) {
            $versionNumbers = @("0", "0", "0", "0")
          }
          while ($versionNumbers.Count -lt 4) {
            $versionNumbers += "0"
          }
          $versionInfo = ($versionNumbers | Select-Object -First 4) -join "."
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build\windows\runner\Release"
          }
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release output directory was not found."
          }
          # Inno Setup resolves relative Source paths against the .iss directory,
          # so pass an absolute path for the build output.
          $releaseDir = (Resolve-Path $releaseDir).Path

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "dist\${env:APP_NAME}-$safeTagName.zip" -Force

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "distribution\windows\morebettergakujo.iss" `
            "/DMyBuildDir=$releaseDir" `
            "/DMyOutputDir=$((Resolve-Path dist).Path)" `
            "/DMyAppVersion=$appVersion" `
            "/DMyAppVersionInfo=$versionInfo" `
            "/DMyOutputBaseFilename=${env:APP_NAME}-$safeTagName"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish_all:
    permissions:
      contents: write
    needs: [verify_release, android, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify_release.outputs.commit }}
      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-dmg
          path: dist

      - name: Download Android artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-apk
          path: dist
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows
          path: dist
      - name: Publish all verified artifacts together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/staged_release.py all dist

  publish_ios:
    permissions:
      contents: write
    needs: [verify_release, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify_release.outputs.platform_commit }}
      - name: Download iOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-ipa
          path: dist
      - name: Add iOS to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLATFORM_COMMIT: ${{ needs.verify_release.outputs.platform_commit }}
        run: python3 scripts/staged_release.py ios dist

      - name: Checkout main for AltStore source update
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          path: repository

      - name: Regenerate SideStore/AltStore source
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        working-directory: repository
        env:
          RELEASE_COMMIT: ${{ needs.verify_release.outputs.platform_commit }}
        run: |
          set -euo pipefail
          ipa_path="$(find ../dist -type f -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "::error::Downloaded ios-ipa artifact does not contain an IPA."
            exit 1
          fi

          release_pubspec_version="$(
            git show "${RELEASE_COMMIT}:pubspec.yaml" |
              awk '/^version:/ { print $2; exit }'
          )"
          if [ -z "$release_pubspec_version" ]; then
            echo "::error::Could not read the version from ${RELEASE_TAG}:pubspec.yaml."
            exit 1
          fi

          PUBSPEC_VERSION="$release_pubspec_version" \
          RELEASE_TAG="${RELEASE_TAG}" \
          RELEASE_DATE="$(date +%Y-%m-%d)" \
          RELEASE_NOTES="${RELEASE_NOTES}" \
          bash scripts/generate_altstore_source.sh "$ipa_path"

      - name: Commit AltStore source update to main
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        working-directory: repository
        run: |
          set -euo pipefail
          if git diff --quiet -- distribution/altstore-source.json; then
            echo "AltStore source is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/altstore-source.json
          git commit -m "Update AltStore source for ${RELEASE_TAG}"

          if ! git push origin HEAD:main; then
            echo "::warning::GitHub Release was published, but the AltStore source update could not be pushed to main."
          fi
