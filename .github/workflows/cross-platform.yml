name: Cross-platform Flutter

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - run: flutter pub get
      - run: flutter test
      - run: flutter build macos --debug
      - run: flutter build ios --debug --no-codesign
      - name: Package macOS debug app
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find build/macos/Build/Products/Debug -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "macOS .app bundle not found" >&2
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            dist/MoreBetterGakujo-macos-debug.zip
      - name: Upload macOS debug artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-debug-app
          path: dist/MoreBetterGakujo-macos-debug.zip
          if-no-files-found: error
          retention-days: 7
      - name: Package unsigned iOS debug app
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/ios/iphoneos/Runner.app"
          if [ ! -d "$app_path" ]; then
            echo "iOS .app bundle not found: $app_path" >&2
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            dist/MoreBetterGakujo-ios-debug.zip
      - name: Upload iOS debug artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-debug-app
          path: dist/MoreBetterGakujo-ios-debug.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug
