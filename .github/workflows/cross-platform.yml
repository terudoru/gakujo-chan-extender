name: Cross-platform Flutter

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: tools/pdf_preview
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci
        working-directory: web_scripts
      - run: npm run check
        working-directory: web_scripts
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - run: bash scripts/test_darwin_secure_storage.sh
      - run: flutter pub get
      - run: flutter test
      - run: flutter build macos --debug
      - run: flutter build ios --debug --no-codesign
      - name: Package macOS debug app
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find build/macos/Build/Products/Debug -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "macOS .app bundle not found" >&2
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            dist/MoreBetterGakujo-macos-debug.zip
      - name: Upload macOS debug artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-debug-app
          path: dist/MoreBetterGakujo-macos-debug.zip
          if-no-files-found: error
          retention-days: 7
      - name: Package unsigned iOS debug app
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/ios/iphoneos/Runner.app"
          if [ ! -d "$app_path" ]; then
            echo "iOS .app bundle not found: $app_path" >&2
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            dist/MoreBetterGakujo-ios-debug.zip
      - name: Upload iOS debug artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-debug-app
          path: dist/MoreBetterGakujo-ios-debug.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug

  ios-simulator:
    # Manual runs only: it cannot sign in to Gakujo, so it checks launch only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - name: Launch on a simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')"
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No available iPhone simulator" >&2
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$udid" net.yoshida.morebettergakujo
          sleep 45
          mkdir -p dist
          xcrun simctl io "$udid" screenshot dist/ios-simulator.png
          xcrun simctl spawn "$udid" log show --last 2m --style compact \
            --predicate 'process == "Runner"' > dist/ios-simulator.log || true
          # Simulator apps run as host processes; the launchctl label format
          # varies between iOS runtimes, so look for the process itself.
          if ! pgrep -f 'iphonesimulator/Runner.app/Runner|/Runner.app/Runner' > /dev/null; then
            echo "The app is not running 45 seconds after launch" >&2
            tail -50 dist/ios-simulator.log >&2 || true
            exit 1
          fi
          echo "The app is still running 45 seconds after launch"
      - name: Upload simulator screenshot and log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-smoke
          path: dist/
          if-no-files-found: warn
          retention-days: 7
