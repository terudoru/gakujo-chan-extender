name: Report form tests

on:
  push:
    paths:
      - 'report_form/**'
      - 'site/report/**'
      - '.github/workflows/report-form.yml'
  pull_request:
    paths:
      - 'report_form/**'
      - 'site/report/**'
      - '.github/workflows/report-form.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report_form
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # Same pin as pages.yml
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # The tests use only Node's built-in modules, so there is nothing to install.
      - run: npm test
