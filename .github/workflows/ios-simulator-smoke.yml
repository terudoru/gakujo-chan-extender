name: iOS simulator smoke test

# Manual check that the iOS app starts and stays running on a simulator.
# It cannot sign in to Gakujo, so it only covers launch and the first screen.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - name: Launch on a simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')"
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No available iPhone simulator" >&2
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$udid" net.yoshida.morebettergakujo
          sleep 45
          mkdir -p dist
          xcrun simctl io "$udid" screenshot dist/ios-simulator.png
          xcrun simctl spawn "$udid" log show --last 2m --style compact \
            --predicate 'process == "Runner"' > dist/ios-simulator.log || true
          if ! xcrun simctl spawn "$udid" launchctl list \
            | grep -q 'UIKitApplication:net.yoshida.morebettergakujo'; then
            echo "The app is not running 45 seconds after launch" >&2
            tail -50 dist/ios-simulator.log >&2 || true
            exit 1
          fi
          echo "The app is still running 45 seconds after launch"
      - name: Upload simulator screenshot and log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-smoke
          path: dist/
          if-no-files-found: warn
          retention-days: 7
