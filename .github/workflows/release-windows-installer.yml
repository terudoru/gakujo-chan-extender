name: Release Windows Installer

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.67.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  APP_NAME: MoreBetterGakujo

jobs:
  verify_release:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Checkout main and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag is part of main
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Invalid release tag.'
            exit 1
          fi
          commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main
          tag_version="${RELEASE_TAG#v}"
          tag_version="${tag_version%%-*}"
          release_version="$(git show "${commit}:pubspec.yaml" | awk '/^version:/ { print $2; exit }')"
          release_version="${release_version%%+*}"
          if [[ "$release_version" != "$tag_version" ]]; then
            echo '::error::The release tag does not match the app version.'
            exit 1
          fi
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != false ]]; then
            echo '::error::Windows installers require an existing published release.'
            exit 1
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  windows-installer:
    needs: [verify_release]
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify_release.outputs.commit }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: false

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check out release tools from the workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/write_google_oauth_defines.py
            scripts/package_windows_release.ps1
          sparse-checkout-cone-mode: false

      - name: Prepare Google OAuth defines
        env:
          GOOGLE_OAUTH_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_DESKTOP_CLIENT_ID }}
          GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET }}
        run: python .release-tools/scripts/write_google_oauth_defines.py --platform desktop --out build/google_oauth_defines.json

      - name: Build Windows app
        run: flutter build windows --release --dart-define-from-file=build/google_oauth_defines.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package Windows portable zip and installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: ./.release-tools/scripts/package_windows_release.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: [windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: dist
      - name: Upload Windows assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.exe dist/*.zip --clobber
