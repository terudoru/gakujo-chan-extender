name: Release Windows Installer

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.67.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  APP_NAME: MoreBetterGakujo

jobs:
  verify_release:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Checkout main and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag is part of main
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Invalid release tag.'
            exit 1
          fi
          commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  windows-installer:
    needs: [verify_release]
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify_release.outputs.commit }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: false

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package Windows portable zip and installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          $tagName = $env:RELEASE_TAG
          $safeTagName = $tagName -replace '[^A-Za-z0-9._-]', '-'
          $appVersion = $safeTagName -replace '^[vV]', ''
          $versionNumbers = @([regex]::Matches($appVersion, '\d+') | ForEach-Object { $_.Value })
          if ($versionNumbers.Count -eq 0) {
            $versionNumbers = @("0", "0", "0", "0")
          }
          while ($versionNumbers.Count -lt 4) {
            $versionNumbers += "0"
          }
          $versionInfo = ($versionNumbers | Select-Object -First 4) -join "."
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build\windows\runner\Release"
          }
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release output directory was not found."
          }
          # Inno Setup resolves relative Source paths against the .iss directory,
          # so pass an absolute path for the build output.
          $releaseDir = (Resolve-Path $releaseDir).Path

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "dist\${env:APP_NAME}-$safeTagName.zip" -Force

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "distribution\windows\morebettergakujo.iss" `
            "/DMyBuildDir=$releaseDir" `
            "/DMyOutputDir=$((Resolve-Path dist).Path)" `
            "/DMyAppVersion=$appVersion" `
            "/DMyAppVersionInfo=$versionInfo" `
            "/DMyOutputBaseFilename=${env:APP_NAME}-$safeTagName"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: [windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            dist/*.exe
            dist/*.zip
