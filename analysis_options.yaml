analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - third_party/**
include: package:lints/recommended.yaml

linter:
  rules:
    avoid_print: true
    discarded_futures: true
    prefer_final_locals: true
    unawaited_futures: true
    use_build_context_synchronously: true
