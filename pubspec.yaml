name: morebettergakujo_flutter
description: Flutter WebView app for More Better Gakujo with portable 2FA autofill.
publish_to: "none"

version: 0.70.2+72

environment:
  sdk: ">=3.13.7 <4.0.0"
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_secure_storage: ^10.3.4
  webview_flutter: ^4.10.0
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  # 1.2.0 with a trackpad scrolling fix; see third_party/webview_flutter_windows.
  webview_flutter_windows:
    path: third_party/webview_flutter_windows
  package_info_plus: ^10.1.0
  image_picker: ^1.2.4

dependency_overrides:
  # 0.3.2 with a macOS keychain readAll fix; see third_party/flutter_secure_storage_darwin.
  flutter_secure_storage_darwin:
    path: third_party/flutter_secure_storage_darwin
  # 4.2.2 with Windows data-loss fixes; see third_party/flutter_secure_storage_windows.
  flutter_secure_storage_windows:
    path: third_party/flutter_secure_storage_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.25.8

flutter:
  uses-material-design: true
  assets:
    # pdf.js, pdf-lib and JSZip for compressing oversized uploads.
    - assets/js/upload_compression/
    - tools/pdf_preview/assets/
    - tools/pdf_preview/licenses/
    - tools/pdf_preview/licenses/pdfium/
    - assets/pdf_preview/web/
    - assets/pdf_preview/web/canvaskit/
    - assets/pdf_preview/web/canvaskit/chromium/
    - assets/pdf_preview/web/canvaskit/webparagraph/
    - assets/pdf_preview/web/assets/
    - assets/pdf_preview/web/assets/fonts/
    - assets/pdf_preview/web/assets/fonts/fallback/
    - assets/pdf_preview/web/assets/packages/cupertino_icons/assets/
    - assets/pdf_preview/web/assets/packages/material_ui/shaders/
    - assets/pdf_preview/web/assets/packages/pdfrx/assets/
    - assets/pdf_preview/web/assets/shaders/
