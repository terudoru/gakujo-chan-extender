<body><main><nav><a href="../index.html">ホーム</a><a href="../privacy.html">プライバシーポリシー</a></nav><h1>不具合・要望を送る</h1>
<div id="unavailable"><p>フォームは現在準備中です。</p><p><a href="https://github.com/terudoru/gakujo-chan-extender/issues/new" target="_blank" rel="noopener noreferrer">GitHub から報告する（アカウントが必要・投稿はすぐ公開、新しいタブで開きます）</a></p><p>氏名・学籍番号・パスワード・成績・学情の画面の内容は書かないでください。</p></div>

</main>
<script>
const REPORT_APP_URL = 'https://script.google.com/macros/s/AKfycbz0NObSZdcrMBX2TGZYsrM0NPPtcNm35nzzMLeiWsJnnGr1LoyHjlSyIfA1RxWJw6-Y/exec';
if (typeof REPORT_APP_URL === 'string' && /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(REPORT_APP_URL)) {
  const frame = document.createElement('iframe');
  frame.title = 'More Better Gakujo 不具合・要望の報告フォーム';
  frame.src = REPORT_APP_URL;
  document.getElementById('form-container').appendChild(frame);
  document.getElementById('fallback').href = REPORT_APP_URL;

  document.getElementById('available').hidden = false;
